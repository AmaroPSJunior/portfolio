name: Supabase Database Migration CI/CD

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  deploy-migrations:
    name: 🗄️ Aplicar Migrations no Supabase Remoto
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚡ Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 🔗 Vincular Projeto Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} -p "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: 🚀 Executar e Sincronizar Migrations (Resilient Auto-Repair)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "🔄 Iniciando sincronização de migrações no Supabase..."
          
          # Tentativa 1: Execução direta com flags de resiliência
          if supabase db push --include-all -p "$SUPABASE_DB_PASSWORD"; then
            echo "✅ Migrações aplicadas com sucesso no primeiro ciclo."
            exit 0
          fi

          echo "⚠️ Falha na execução padrão. Iniciando rotina automática de reconciliação de histórico..."

          # Captura do status atual das migrações
          MIGRATION_LIST=$(supabase migration list -p "$SUPABASE_DB_PASSWORD" 2>&1 || true)
          echo "$MIGRATION_LIST"

          # Identificação de versões remotas órfãs ausentes no diretório local
          REMOTE_ORPHANS=$(echo "$MIGRATION_LIST" | grep -i "Remote" | grep -v "Local" | awk '{print $1}' | grep -E '^[0-9]+$' || true)

          if [ -n "$REMOTE_ORPHANS" ]; then
            echo "🛠️ Versões remotas órfãs encontradas: $REMOTE_ORPHANS"
            for VERSION in $REMOTE_ORPHANS; do
              echo "🔧 Reparando histórico remoto para a versão $VERSION..."
              supabase migration repair --status reverted "$VERSION" -p "$SUPABASE_DB_PASSWORD" || true
            done
          fi

          # Tentativa 2: Re-execução após reparo de histórico
          echo "🚀 Re-executando db push pós-reconciliação..."
          supabase db push --include-all -p "$SUPABASE_DB_PASSWORD"
